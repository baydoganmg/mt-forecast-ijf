# Conda environment for mt-forecast.
#
# Linux + macOS (Intel + Apple Silicon).  Uses conda-forge for the
# native OpenMP runtime (`llvm-openmp`) and the C++ toolchain so the
# extensions build cleanly without manual `brew install libomp` or
# `apt install build-essential` steps.
#
# Create:    conda env create -f environment.yml
# Activate:  conda activate mt-forecast
# Install:   pip install -e .
#
name: mt-forecast
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.13
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.7
  - scikit-learn>=1.0
  - joblib>=1.0
  - statsmodels>=0.13
  - pyyaml>=6.0
  - openpyxl>=3.0
  - tqdm>=4.60
  - matplotlib>=3.5
  - cython>=0.29
  - pybind11>=2.11
  - setuptools>=60
  - llvm-openmp           # OpenMP runtime (Linux + macOS)
  # Platform-appropriate C/C++ compiler (conda picks the right one)
  - c-compiler
  - cxx-compiler
  - pip
  - pip:
      # Anything pip-only would go here. Leave empty for v1.
