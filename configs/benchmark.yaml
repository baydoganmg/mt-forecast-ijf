# Post-fix benchmark: MASE-CV + per-series adaptive TSCV (v2).
# Output-path settings for the benchmark -- the TSCV
# refinement (per-series adaptive folds, no global drop) lives in tree.py and
# applies to any cv_type='timeseries' run. Outputs land in fresh v2 dirs so v1
# results stay quarantined for comparison.

data_path: data/
results_path: results/
info_table: data/repo_data_info.xlsx

result_prefix: benchmark
forecast_dir: forecasts_benchmark
cv_dir: full_tuning_benchmark

nthreads: auto  # mDT final fit: P-aware OMP (1 for low-feature data, up to 4; capped at cores). Bit-exact.
n_jobs_cv: 5  # CV grid parallelism over (param x fold) tasks. Deterministic via M0 RNG.
test_horizon: 1
n_diff: 1
diff_features: false
seed: 10
cv_type: timeseries
aggregation: score
cv_metric: rmse
prebin: false  # selfhash (cpp production path); default in run_benchmark.py is True (legacy Cython prebin fallback)

max_depth: 40
min_samples_leaf: 5
n_discrete_lev: 32

nfolds: 5
min_depth: 4
depth_increment: 4

decay_set: [0, 0.5, 1]
lambda_set: [0, 0.2, 0.5]
beta_set: [0, 0.2, 0.5]

bdt:
  n_estimators: 400
  lr: 0.05
  bagging_fraction: 0.8
  feature_fraction: 0.5
  max_depth: 8
  num_threads: auto  # mGBT: P-aware OMP (1 for low-feature data, up to 4; capped at cores). Bit-exact.
  eval_metric: mase  # ES on test-time MASE (matches paper main.tex:428). eval_seasonal_scale is passed by cv/run_benchmark; inf-guarded in ensemble.py. mse traps FREDMD in a local-min early-stopping basin; mase is neutral-or-better across the 28-dataset sweep.

rf:
  n_estimators: 400
  bagging_fraction: 0.8
  feature_fraction: 0.5
  max_depth: 40
  n_jobs: 10  # parallel workers across trees (forest identical for any n_jobs)
  backend: thread  # thread (shared mem, flat memory) | process (loky) | sequential
  num_threads: 1   # per-tree OMP; keep 1 for mRF (across-tree parallelism via n_jobs)
