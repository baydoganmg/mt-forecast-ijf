[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "cython>=0.29",
    "pybind11>=2.11",
    "numpy>=1.21",
]
build-backend = "setuptools.build_meta"

[project]
name = "mt-forecast"
version = "0.1.0"
description = "Multi-target tree learning for time series forecasting (mDT, mGBT, mRF)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Mustafa Gökçe Baydoğan"},
]
keywords = [
    "time-series", "forecasting", "regression-tree",
    "gradient-boosting", "random-forest", "multi-target",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "joblib>=1.0",
    "statsmodels>=0.13",
    "pyyaml>=6.0",
    "openpyxl>=3.0",
    "tqdm>=4.60",
    "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/<owner>/mt-forecast"

[tool.setuptools.packages.find]
include = ["mttrees*"]
exclude = ["tests*", "examples*", "scripts*", "results*", "logs*"]
